<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Europe Map</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <aside id="panel">
    <header id="panel-header">
      <span class="eyebrow">Interactive atlas</span>
      <h1>Europe</h1>
    </header>

    <div id="layer-list" aria-label="Map layers"></div>

    <div id="panel-footer">
      <div id="feature-info" class="empty">Click a feature on the map for details.</div>
    </div>
  </aside>

  <button id="panel-toggle" aria-label="Toggle layer panel">
    <span></span><span></span><span></span>
  </button>

  <main id="map"></main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
